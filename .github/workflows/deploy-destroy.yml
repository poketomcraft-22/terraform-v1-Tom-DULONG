name: Deploy & Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action à exécuter"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

jobs:
  setup-environment:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

  deploy:
    needs: setup-environment
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Run Make Deploy
        run: make deploy

      - name: Display Success and Website Link
        run: |
          cd terraform
          PUBLIC_IP=$(terraform output -raw ec2_public_ip)
          echo "========================================================"
          echo "✅ Création réussie !"
          echo "🌐 Adresse IP publique : $PUBLIC_IP"
          echo "🔗 Lien d'accès du site : http://$PUBLIC_IP"
          echo "========================================================"

          # Ajout d'un résumé visuel dans l'interface GitHub Actions
          echo "### ✅ Création réussie !" >> $GITHUB_STEP_SUMMARY
          echo "- **Adresse IP publique :** \`$PUBLIC_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lien d'accès du site :** [http://$PUBLIC_IP](http://$PUBLIC_IP)" >> $GITHUB_STEP_SUMMARY

  destroy:
    needs: setup-environment
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Run Make Destroy
        run: make destroy

      - name: Display Destroy Success
        run: |
          echo "========================================================"
          echo "🗑️ Tout a bien été supprimé correctement !"
          echo "========================================================"

          # Ajout d'un résumé visuel dans l'interface GitHub Actions
          echo "### 🗑️ Suppression réussie !" >> $GITHUB_STEP_SUMMARY
          echo "Toutes les ressources ont bien été supprimées correctement." >> $GITHUB_STEP_SUMMARY
