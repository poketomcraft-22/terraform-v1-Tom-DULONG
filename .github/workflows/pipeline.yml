name: PipeLine de Tom Dulong

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action à exécuter"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

jobs:
  # 1. Job de validation obligatoire (Étape 1 du TP : fmt, tflint, trivy)
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy Directly
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Terraform Format Check
        run: make fmt

      - name: Run TFLint
        run: make tflint

      - name: Run Trivy Security Scan
        run: make trivy

  # 2. Job d'initialisation et configuration commune
  setup:
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      selected-action: ${{ inputs.action }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

  # 3. Job de Déploiement (S'exécute uniquement si 'deploy' est choisi et si la validation est OK)
  deploy:
    needs: [validate, setup]
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Run Make Deploy
        run: make deploy

      - name: Upload Terraform State
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          retention-days: 1

      - name: Display Success Message
        run: |
          cd terraform
          PUBLIC_IP=$(terraform output -raw ec2_public_ip)
          echo "========================================================"
          echo "✅ Création réussie !"
          echo "🌐 Adresse IP publique : $PUBLIC_IP"
          echo "🔗 Lien d'accès du site : http://$PUBLIC_IP"
          echo "========================================================"

          echo "### ✅ Création réussie !" >> $GITHUB_STEP_SUMMARY
          echo "- **Adresse IP publique :** \`$PUBLIC_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lien d'accès du site :** [http://$PUBLIC_IP](http://$PUBLIC_IP)" >> $GITHUB_STEP_SUMMARY

  # 4. Job de Destruction (S'exécute uniquement si 'destroy' est choisi)
  destroy:
    needs: [validate, setup]
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Download Terraform State
        uses: dawidd6/action-download-artifact@v3
        with:
          name: terraform-state
          path: terraform/
          if_no_artifact_found: ignore

      - name: Run Make Destroy
        run: make destroy

      - name: Display Destroy Success Message
        run: |
          echo "========================================================"
          echo "🗑️ Tout a bien été supprimé correctement !"
          echo "========================================================"

          echo "### 🗑️ Suppression réussie !" >> $GITHUB_STEP_SUMMARY
          echo "Toutes les ressources ont bien été supprimées correctement." >> $GITHUB_STEP_SUMMARY
