name: CI Pipeline

on:
  push:
    branches: [ "main", "TP-1" ]

jobs:
  test:
    name: Test sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform
        run: terraform init -backend=false && terraform validate

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'

      - name: Install Gitleaks
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
            tar -xzf gitleaks_8.18.2_linux_x64.tar.gz gitleaks
            sudo mv gitleaks /usr/local/bin/
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            brew install gitleaks
          elif [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            choco install gitleaks -y
          fi

      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        continue-on-error: true
        run: |
          gitleaks detect --source . --verbose

      - name: Create HTML Report & Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "success" ]; then
            MSG="GOOD ! Il n'y a aucun leak, tout va bien beau gosse ! 😎"
            COLOR="#dcfce7"
          else
            MSG="ALERTE ! Il y a des leaks détectés dans le code ! 🚨"
            COLOR="#fee2e2"
          fi

          # 1. Envoi dans l'interface GitHub Summary
          echo "## Résultat du scan (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "$MSG" >> $GITHUB_STEP_SUMMARY

          # 2. Génération d'un VRAI fichier HTML lisible par tous les navigateurs
          cat <<EOF > rapport_${{ matrix.os }}.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Rapport ${{ matrix.os }}</title>
          </head>
          <body style="font-family: Arial, sans-serif; padding: 20px;">
              <h2>Rapport de Sécurité CI/CD - OS: ${{ matrix.os }}</h2>
              <div style="background-color: ${COLOR}; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14pt;">
                  ${MSG}
              </div>
          </body>
          </html>
          EOF

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-${{ matrix.os }}
          path: rapport_${{ matrix.os }}.html
