name: CI Pipeline Multi-OS

on:
  push:
    branches: [ "main", "TP-1" ]
  pull_request:
    branches: [ "main", "TP-1" ]

jobs:
  test:
    name: Test sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'

      # Installation de Gitleaks selon l'OS
      - name: Install Gitleaks
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            wget https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
            tar -xzf gitleaks_8.24.0_linux_x64.tar.gz gitleaks
            sudo mv gitleaks /usr/local/bin/
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            brew install gitleaks
          elif [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            choco install gitleaks -y
          fi

      # Run Gitleaks & écriture du résumé individuel sur l'affichage du job
      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        continue-on-error: true
        run: |
          gitleaks detect --source . --verbose
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "## No leaks detected ✅" >> $GITHUB_STEP_SUMMARY
            echo "GOOD ! Il n'y a aucun leak, tout va bien beau gosse ! 😎" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Leaks detected 🚨" >> $GITHUB_STEP_SUMMARY
            echo "ALERTE ! Il y a des leaks détectés dans le code !" >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
