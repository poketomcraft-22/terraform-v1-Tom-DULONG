name: CI Pipeline

on:
  push:
    branches: [ "main", "TP-1" ]

jobs:
  test:
    name: Test sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform
        run: terraform init -backend=false && terraform validate

      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'

      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      # Génération du rapport PDF basique sans Python
      - name: Create PDF Report
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "success" ]; then
            MSG="GOOD ! Il n'y a aucun leak, tout va bien beau gosse ! 😎"
          else
            MSG="ALERTE ! Il y a des leaks détectés dans le code !"
          fi
          echo -e "%PDF-1.4\n1 0 obj<<>>endobj\ntrailer<<>>\n%%EOF\n\n=== RAPPORT DE SECURITE (${{ matrix.os }}) ===\n$MSG" > rapport_${{ matrix.os }}.pdf

      # Envoi de l'artefact PDF
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-pdf-${{ matrix.os }}
          path: rapport_${{ matrix.os }}.pdf
