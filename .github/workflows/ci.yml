name: CI Pipeline Security Check

on:
  push:
    branches: [ "main", "TP-1" ]
  pull_request:
    branches: [ "main", "TP-1" ]

jobs:
  security-audit:
    runs-on: ubuntu-22.04

    steps:
      # 1. Récupérer le code avec tout l'historique
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Scanner le code avec Gitleaks (action officielle, propre et rapide)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
