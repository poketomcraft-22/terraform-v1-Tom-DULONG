name: CI Pipeline

on:
  push:
    branches: [ "main", "TP-1" ]
  pull_request:
    branches: [ "main", "TP-1" ]

jobs:
  test:
    name: Test sur ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Vérification Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform
        run: |
          terraform init -backend=false
          terraform validate

      # 3. Scan Trivy
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'

      # 4. Installation universelle de Gitleaks selon l'OS
      - name: Install Gitleaks
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            wget https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
            tar -xzf gitleaks_8.24.0_linux_x64.tar.gz gitleaks
            sudo mv gitleaks /usr/local/bin/
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            brew install gitleaks
          elif [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            choco install gitleaks -y
          fi

      # 5. Exécution Gitleaks
      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        continue-on-error: true
        run: |
          gitleaks detect --source . --verbose

      # 6. Création du rapport basique
      - name: Create Report
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "success" ]; then
            echo "GOOD ! Il n'y a aucun leak, tout va bien beau gosse !" > rapport_${{ matrix.os }}.txt
          else
            echo "ALERTE ! Il y a des leaks détectés !" > rapport_${{ matrix.os }}.txt
          fi

      # 7. Télécharger le rapport
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-${{ matrix.os }}
          path: rapport_${{ matrix.os }}.txt
