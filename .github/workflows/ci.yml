name: CI Pipeline (Security & Healthcheck)

on:
  push:
    branches: [ "main", "TP-1" ]
  pull_request:
    branches: [ "main", "TP-1" ]

jobs:
  pipeline:
    # Utilisation d'Ubuntu 22.04 LTS (version stable)
    runs-on: ubuntu-22.04

    steps:
      # 1. Récupération du code source
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Détection de secrets avec Gitleaks (make secrets)
      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.0_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (make secrets)
        run: make secrets

      # 3. Scan de vulnérabilités avec Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'          # Scan du système de fichiers
          scan-ref: '.'             # Dossier racine
          severity: 'CRITICAL,HIGH' # Alerte sur les failles critiques et hautes

      # 4. Healthcheck de l'environnement de CI
      - name: Environment Healthcheck
        run: |
          echo "=== RUNNING HEALTHCHECK ==="
          echo "1. OS Version Check:"
          lsb_release -a
          echo "2. Disk Space Check:"
          df -h /
          echo "3. Memory Check:"
          free -m
          echo "4. Required Tools Check:"
          command -v git && echo "Git OK"
          command -v make && echo "Make OK"
          echo "=== HEALTHCHECK PASSED ==="
