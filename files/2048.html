<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>2048 Arcade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="portal-container">
        <h1>2048 ARCADE</h1>
        <p class="subtitle">Fusionne les nombres pour atteindre 2048 !</p>
        <div class="card-game" style="max-width: 400px;">
            <div class="game-header">
                <span>SCORE : <span id="score">0</span></span>
            </div>
            <div class="grid-2048" id="grid-2048"></div>
            <p class="controls-hint">Utilise les <strong>flèches directionnelles</strong></p>
        </div>
        <div style="margin-top: 20px;">
            <a href="index.html" class="btn">← Retour au portail</a>
        </div>
    </div>
    <script src="2048.js"></script>
</body>
</html>
