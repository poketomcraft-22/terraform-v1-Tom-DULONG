<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bubble Shooter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="portal-container bubble-container">
        <h1>BUBBLE SHOOTER</h1>
        <p class="subtitle">Aligne 3 bulles de même couleur pour les faire éclater !</p>
        <div class="card-game">
            <div class="game-header">
                <span>SCORE : <span id="score">0</span></span>
            </div>
            <canvas id="bubbleCanvas" width="360" height="450"></canvas>
            <p class="controls-hint">Clique sur le canvas pour tirer vers la souris</p>
            <button id="restartBtn" class="btn hidden" style="margin-top: 15px;">Rejouer 🔄</button>
        </div>
        <div style="margin-top: 20px;">
            <a href="index.html" class="btn">← Retour au portail</a>
        </div>
    </div>
    <script src="bubleshooter.js"></script>
</body>
</html>
