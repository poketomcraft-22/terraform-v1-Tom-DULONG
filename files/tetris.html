<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tetris Arcade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="portal-container">
        <h1>TETRIS ARCADE</h1>
        <p class="subtitle">Empile les blocs, fais des lignes et bats ton score !</p>

        <div class="tetris-layout">
            <!-- Panneau gauche : Réserve (Hold) et Contrôles -->
            <div class="side-panel">
                <div class="score-board" style="text-align: center;">
                    <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 5px;">RÉSERVE [C]</div>
                    <canvas id="holdCanvas" width="80" height="80" class="mini-board"></canvas>
                </div>
                <div class="score-board">
                    <div style="font-size: 0.8rem; color: #8b949e;">CONTRÔLES</div>
                    <div style="font-size: 0.75rem; margin-top: 5px; line-height: 1.4;">
                        <b>← / →</b> : Déplacer<br>
                        <b>↓</b> : Descendre vite<br>
                        <b>Q / D</b> : Tourner<br>
                        <b>C</b> : Réserver
                    </div>
                </div>
            </div>

            <!-- Plateau principal du jeu -->
            <div class="card-game">
                <div class="game-header">
                    <span>SCORE : <span id="score">0</span></span>
                    <span>LIGNES : <span id="lines">0</span></span>
                </div>
                <canvas id="tetris" width="240" height="400"></canvas>
            </div>

            <!-- Panneau droit : Prochain bloc -->
            <div class="side-panel">
                <div class="score-board" style="text-align: center;">
                    <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 5px;">SUIVANT</div>
                    <canvas id="nextCanvas" width="80" height="80" class="mini-board"></canvas>
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <a href="index.html" class="btn">← Retour au portail</a>
        </div>
    </div>

    <!-- Script du jeu -->
    <script src="tetris.js"></script>
</body>
</html>
