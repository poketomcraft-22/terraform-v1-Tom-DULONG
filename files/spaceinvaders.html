<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Space Invaders Arcade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="portal-container">
        <h1>SPACE INVADERS</h1>
        <p class="subtitle">Défends la galaxie !</p>
        <div class="card-game">
            <div class="game-header">
                <span>SCORE : <span id="score">0</span></span>
            </div>
            <canvas id="invadersCanvas" width="400" height="400"></canvas>
            <p class="controls-hint"><strong>Flèches</strong> pour bouger | <strong>Espace</strong> pour tirer</p>
        </div>
        <div style="margin-top: 20px;">
            <a href="index.html" class="btn">← Retour au portail</a>
        </div>
    </div>
    <script src="spaceinvaders.js"></script>
</body>
</html>
